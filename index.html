<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Джем-ротация</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;--bg:#eceff4;--card:#fff;--fg:#14172b;--mut:#5b6079;--line:#d6dae6;--acc:#4f46e5;--on:#fff;--chip:#e2e6f0;--bad:#c62f4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1020;--card:#1a1b30;--fg:#eceafc;--mut:#9a9cc0;--line:#2d2f4d;--acc:#9d8cff;--on:#12102b;--chip:#25264a;--bad:#ff7a90}}
:root[data-theme="dark"]{--bg:#0f1020;--card:#1a1b30;--fg:#eceafc;--mut:#9a9cc0;--line:#2d2f4d;--acc:#9d8cff;--on:#12102b;--chip:#25264a;--bad:#ff7a90}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,nav,main{max-width:560px;margin:0 auto}
h1{font-size:22px;padding:14px 16px 4px}
nav{display:flex;gap:8px;padding:8px 16px}
main{padding:0 16px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600}
nav button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0}
.hd{font-size:15px;color:var(--mut);margin-bottom:4px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hd+.ln{border-top:0}
.ln b{display:block;font-size:22px}
.ln small{display:block;color:var(--mut);font-size:15px}
.gl{padding:8px 0;border-top:1px solid var(--line)}
.hd+.gl{border-top:0}
.gl b{display:block;font-size:15px;color:var(--mut)}
.note{color:var(--mut);font-size:14px;margin:8px 2px}
input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;padding:0 12px;margin-bottom:10px}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--chip);border-radius:999px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.row{display:flex;gap:8px}
.row>input{flex:1;min-width:0}
.pri,.sec{min-height:48px;border-radius:12px;border:1px solid var(--line);padding:0 16px;font-weight:600}
.pri{background:var(--acc);border-color:var(--acc);color:var(--on);flex:1}
.sec{background:var(--card)}
.bad{color:var(--bad)}
.big{width:100%;min-height:58px;font-size:19px}
.pr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.pr.off{opacity:.55}
.in{flex:1;min-width:0;cursor:pointer}
.in b,.in small{display:block}
.in small{color:var(--mut)}
.sw{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#bar button{display:block;max-width:560px;margin:0 auto}
#msg{color:var(--bad);font-size:14px;min-height:20px}
.empty{color:var(--mut);text-align:center;padding:40px 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Джем-ротация</h1>
<nav id="tabs"><button data-t="jam" class="on">Джем</button><button data-t="ppl">Участники <span id="cnt"></span></button></nav>
<main>
<section id="jam"></section>
<section id="ppl" hidden>
<div class="card">
<input id="nm" placeholder="Имя" maxlength="30" autocomplete="off">
<div id="chips"></div>
<div class="row"><input id="ci" placeholder="Другой инструмент" maxlength="20" autocomplete="off"><button id="cadd" class="sec" style="min-width:48px;margin-bottom:10px" aria-label="Добавить инструмент">+</button></div>
<div id="msg"></div>
<div class="row"><button id="save" class="pri">Добавить</button><button id="del" class="sec bad" hidden>Удалить</button><button id="cancel" class="sec" hidden>Отмена</button></div>
</div>
<div id="list"></div>
<p class="note">Нажмите на участника, чтобы изменить его. «Пауза» убирает человека из ротации, не стирая счёт.</p>
<div class="row"><button id="rs" class="sec bad" style="flex:1">Сбросить счётчики</button><button id="cl" class="sec bad" style="flex:1">Очистить список</button></div>
</section>
</main>
<div id="bar"><button id="next" class="pri big">Следующая песня</button></div>
<script>
const $=id=>document.getElementById(id),KEY='jam-rotation-v1',
PRE=['Гитара','Бас','Барабаны','Клавиши','Вокал','Саксофон','Труба','Скрипка','Перкуссия'];
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.people))return s}catch(e){}
return{people:[],inst:PRE.slice(),songs:0,plays:{},pairs:{},last:{},cur:null,miss:[],snap:null,rej:[],sig:'',nid:1}})();
S.skipped=S.skipped||[];S.off=S.off||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
by=id=>S.people.find(p=>p.id===id),act=()=>S.people.filter(p=>p.on),
pk=(a,b)=>a<b?a+'|'+b:b+'|'+a,
sig=m=>Object.entries(m).map(e=>e.join(':')).sort().join(',');
const ck=(p,i)=>p+'#'+i,
pc=(p,i)=>(S.plays[ck(p,i)]||0)-(S.off[ck(p,i)]||0),
tot=p=>p.ins.reduce((s,i)=>s+pc(p.id,i),0);
// Счёт ведётся отдельно по каждому инструменту человека; переносим старые данные
if(S.v!==2){const o=S.plays;S.plays={};S.off={};
  S.people.forEach(p=>{p.ins.forEach((i,x)=>{const k=ck(p.id,i);S.plays[k]=x?0:(o[p.id]||0);S.off[k]=x?0:(o[p.id]||0)-(p.n||0)});delete p.n});
  S.snap=null;S.v=2}

// Стартовый счёт для новичка или вернувшегося: как у наименее игравшего из тех, кто с ним на одних инструментах
function base(i,sid){const l=act().filter(p=>p.id!==sid&&p.ins.includes(i)).map(p=>S.plays[ck(p.id,i)]||0);return l.length?Math.min(...l):0}
function lift(p,old){p.ins.forEach(i=>{const k=ck(p.id,i);if(old&&k in S.plays)return;const c=S.plays[k]||0,b=base(i,p.id);S.off[k]=(S.off[k]||0)+Math.max(0,b-c);S.plays[k]=Math.max(c,b)})}

// Один случайный максимальный набор: каждому инструменту по одному человеку (алгоритм Куна)
function match(a,ins,lo){
  const sc={},c={},m={};
  
  ins.forEach(i=>{const l=a.filter(p=>p.ins.includes(i)),r={};l.forEach(p=>r[p.id]=(S.plays[ck(p.id,i)]||0)-lo[i]+Math.random()*2);c[i]=l.sort((x,y)=>r[x.id]-r[y.id]).map(p=>p.id)});
  const aug=(i,seen)=>{for(const p of c[i]){if(seen.has(p))continue;seen.add(p);if(!(p in m)||aug(m[p],seen)){m[p]=i;return true}}return false};
  ins.slice().sort((x,y)=>c[x].length-c[y].length+Math.random()-.5).forEach(i=>aug(i,new Set()));
  return m;
}
// Цена состава: справедливость (отставание по песням), небольшой штраф за игру подряд, повторы пар
function cost(m,lo){
  const k=Object.keys(m);let c=Math.random()*.05;
  if(S.rej.includes(sig(m)))c+=3;
  k.forEach((a,x)=>{const d=(S.plays[ck(a,m[a])]||0)-lo[m[a]];c+=d*d+((S.songs&&S.last[a]===S.songs)?0.3:0);
    for(let y=x+1;y<k.length;y++)c+=0.15*(S.pairs[pk(a,k[y])]||0)});
  return c;
}
function gen(){
  const all=act();if(!all.length)return;
  const a=all.filter(p=>!S.skipped.includes(p.id));if(!a.length)return;
  const ins=S.inst.filter(i=>all.some(p=>p.ins.includes(i))),lo={};
  ins.forEach(i=>{const l=a.filter(p=>p.ins.includes(i)).map(p=>S.plays[ck(p.id,i)]||0);if(l.length)lo[i]=Math.min(...l)});
  S.snap={songs:S.songs,plays:{...S.plays},pairs:{...S.pairs},last:{...S.last}};
  let b=null,bc=1e9;
  for(let t=0;t<400;t++){const m=match(a,ins,lo),c=cost(m,lo);if(c<bc){bc=c;b=m}}
  const k=Object.keys(b);S.songs++;
  k.forEach((p,x)=>{const e=ck(p,b[p]);S.plays[e]=(S.plays[e]||0)+1;S.last[p]=S.songs;
    for(let y=x+1;y<k.length;y++){const q=pk(p,k[y]);S.pairs[q]=(S.pairs[q]||0)+1}});
  S.cur=Object.entries(b);S.sig=sig(b);S.miss=ins.filter(i=>!Object.values(b).includes(i));
}
function reroll(){
  if(!S.snap||!S.cur||!act().some(p=>!S.skipped.includes(p.id)))return;
  S.rej.push(S.sig);
  
  const s=S.snap;S.songs=s.songs;S.plays={...S.plays,...s.plays};S.pairs=s.pairs;S.last=s.last;
  gen();save();render();
}
$('next').onclick=()=>{S.rej=[];S.skipped=[];gen();save();render()};
$('jam').onclick=e=>{const b=e.target.closest('[data-s]');if(b)skip(b.dataset.s)};
// Пропуск одного человека: замена на того же инструмента, остальные не меняются, пропущенному песня не засчитывается
function skip(id){
  const i=S.cur?S.cur.findIndex(c=>c[0]===id):-1;if(i<0||!S.snap)return;
  const inst=S.cur[i][1],q=by(id),rest=S.cur.filter(c=>c[0]!==id&&by(c[0])).map(c=>c[0]);
  {const e=ck(id,inst);S.plays[e]=Math.max(0,(S.plays[e]||0)-1)}
  if(S.snap.last[id]==null)delete S.last[id];else S.last[id]=S.snap.last[id];
  rest.forEach(r=>{const k=pk(id,r);S.pairs[k]=Math.max(0,(S.pairs[k]||0)-1)});
  S.skipped.push(id);
  const inl=new Set(S.cur.map(c=>c[0])),
  cand=act().filter(p=>p.ins.includes(inst)&&!inl.has(p.id)&&!S.skipped.includes(p.id)),
  mn=Math.min(...cand.map(p=>S.plays[ck(p.id,inst)]||0));
  let b=null,bc=1e9;
  cand.forEach(p=>{const d=(S.plays[ck(p.id,inst)]||0)-mn;let c=d*d+((S.songs>1&&S.last[p.id]===S.songs-1)?0.3:0)+Math.random()*0.05;
    rest.forEach(r=>{c+=0.15*(S.pairs[pk(p.id,r)]||0)});if(c<bc){bc=c;b=p}});
  if(b){S.cur[i]=[b.id,inst];const e=ck(b.id,inst);S.plays[e]=(S.plays[e]||0)+1;S.last[b.id]=S.songs;
    rest.forEach(r=>{const k=pk(b.id,r);S.pairs[k]=(S.pairs[k]||0)+1})}
  else{S.cur.splice(i,1);if(!S.miss.includes(inst))S.miss.push(inst)}
  S.sig=sig(Object.fromEntries(S.cur));save();render();
}
function stats(){
  return '<div class="card"><div class="hd">Сколько раз сыграли</div>'+S.inst.map(i=>{const l=S.people.filter(p=>p.ins.includes(i));return l.length?'<div class="gl"><b>'+esc(i)+'</b>'+l.map(p=>esc(p.name)+(p.on?'':' (пауза)')+' '+pc(p.id,i)).join(', ')+'</div>':''}).join('')+'</div>';
}

function rJam(){
  const a=act(),el=$('jam');
  if(!S.people.length){el.innerHTML='<p class="empty">Пока никого нет. Добавьте участников на вкладке «Участники».</p>';return}
  if(!S.cur){el.innerHTML='<p class="empty">В игре: '+a.length+'. Нажмите «Следующая песня», чтобы собрать первый состав.</p>';return}
  const L=S.cur.filter(c=>by(c[0])).sort((x,y)=>S.inst.indexOf(x[1])-S.inst.indexOf(y[1])),
  inl=new Set(S.cur.map(c=>c[0])),sk=S.skipped.map(by).filter(Boolean),w=a.filter(p=>!inl.has(p.id)&&!S.skipped.includes(p.id));
  el.innerHTML='<div class="card"><div class="hd">Песня № '+S.songs+'</div>'+L.map(c=>'<div class="ln"><div><b>'+esc(by(c[0]).name)+'</b><small>'+esc(c[1])+', '+pc(c[0],c[1])+'-я песня</small></div><button class="sw" data-s="'+c[0]+'">Пропустить</button></div>').join('')+'</div>'
  +(S.miss.length?'<p class="note">Некому играть: '+esc(S.miss.join(', '))+'</p>':'')
  +(sk.length?'<p class="note"><b>Пропущены:</b> '+esc(sk.map(p=>p.name).join(', '))+'. Счёт им не засчитан, они сыграют позже.</p>':'')
  +(w.length?'<p class="note"><b>Отдыхают:</b> '+esc(w.map(p=>p.name+' ('+tot(p)+')').join(', '))+'</p>':'')
  +'<button id="rr" class="sec" style="width:100%">Пересобрать этот состав</button>'+stats();
  $('rr').onclick=reroll;
}
function rList(){
  $('list').innerHTML=S.people.map(p=>'<div class="pr'+(p.on?'':' off')+'"><div class="in" data-e="'+p.id+'"><b>'+esc(p.name)+'</b><small>Сыграл: '+p.ins.map(i=>esc(i)+' '+pc(p.id,i)).join(', ')+'</small></div><button class="sw" data-p="'+p.id+'">'+(p.on?'В игре':'Пауза')+'</button></div>').join('');
  $('cnt').textContent=S.people.length?'('+S.people.length+')':'';
}
const render=()=>{rJam();rList()};

// Форма участника
let eid=null,sel=new Set(),tm;
const msg=t=>{$('msg').textContent=t;clearTimeout(tm);tm=setTimeout(()=>{$('msg').textContent=''},2500)};
function rChips(){$('chips').innerHTML=S.inst.map(i=>'<button class="chip'+(sel.has(i)?' on':'')+'" data-i="'+esc(i)+'">'+esc(i)+'</button>').join('')}
function form(id){eid=id||null;const p=eid&&by(eid);$('nm').value=p?p.name:'';sel=new Set(p?p.ins:[]);$('save').textContent=p?'Сохранить':'Добавить';$('del').hidden=$('cancel').hidden=!p;rChips()}
$('chips').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;sel.has(i)?sel.delete(i):sel.add(i);rChips()};
function addInst(){const v=$('ci').value.trim();if(!v)return;let f=S.inst.find(i=>i.toLowerCase()===v.toLowerCase());if(!f){f=v;S.inst.push(v)}sel.add(f);$('ci').value='';rChips();save()}
$('cadd').onclick=addInst;$('ci').onkeydown=e=>{if(e.key==='Enter')addInst()};
$('save').onclick=()=>{
  const n=$('nm').value.trim();
  if(!n){msg('Введите имя');return}
  if(!sel.size){msg('Выберите хотя бы один инструмент');return}
  const ins=S.inst.filter(i=>sel.has(i));
  if(eid){const p=by(eid);p.name=n;p.ins=ins;lift(p,true)}
  else{const p={id:'p'+S.nid++,name:n,ins,on:true};S.people.push(p);lift(p)}
  form();save();render();
};
$('del').onclick=()=>{S.people=S.people.filter(p=>p.id!==eid);delete S.plays[eid];delete S.last[eid];form();save();render()};
$('cancel').onclick=()=>form();
$('list').onclick=e=>{
  const t=e.target.closest('[data-e],[data-p]');if(!t)return;
  if(t.dataset.e){form(t.dataset.e);window.scrollTo(0,0)}
  else{const p=by(t.dataset.p);p.on=!p.on;if(p.on)lift(p);save();render()}
};

// Сброс с подтверждением вторым нажатием
function reset(keep){S.songs=0;S.plays={};S.pairs={};S.last={};S.cur=null;S.miss=[];S.snap=null;S.rej=[];S.skipped=[];if(!keep)S.people=[];S.off={};S.people.forEach(p=>{p.ins.forEach(i=>{S.plays[ck(p.id,i)]=0})});form();save();render()}
function arm(b,fn){let t=0;const o=b.textContent;b.onclick=()=>{if(t){clearTimeout(t);t=0;b.textContent=o;fn();return}b.textContent='Точно? Нажмите ещё раз';t=setTimeout(()=>{t=0;b.textContent=o},3000)}}
arm($('rs'),()=>reset(true));arm($('cl'),()=>reset(false));

function tab(t){$('jam').hidden=t!=='jam';$('ppl').hidden=t!=='ppl';$('bar').hidden=t!=='jam';[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t)};
form();render();tab(S.people.length?'jam':'ppl');
</script>
</body>
</html>
